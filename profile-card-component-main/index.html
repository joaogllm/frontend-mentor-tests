<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Profile card component</title>
  </head>
  <body>
    <main>
      <article class="profile-card">
        <div class="profile-card__banner"></div>
        <div class="profile-card__content">
          <img
            src="./images/image-victor.jpg"
            alt="Victor Crest"
            class="profile-card__avatar"
          />
          <h2 class="profile-card__name">Victor Crest <span>26</span></h2>
          <p class="profile-card__location">London</p>
          <hr class="profile-card__divider" />
          <ul class="profile-card__stats">
            <li>
              <span class="profile-card__stats-number">80K</span>
              <span class="profile-card__stats-label">Followers</span>
            </li>
            <li>
              <span class="profile-card__stats-number">803K</span>
              <span class="profile-card__stats-label">Likes</span>
            </li>
            <li>
              <span class="profile-card__stats-number">1.4K</span>
              <span class="profile-card__stats-label">Photos</span>
            </li>
          </ul>
        </div>
      </article>
    </main>
  </body>
</html>
