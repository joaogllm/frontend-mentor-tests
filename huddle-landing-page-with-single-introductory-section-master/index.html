<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400&family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>
      Frontend Mentor | Huddle landing page with single introductory section
    </title>
  </head>
  <body>
    <main class="page">
      <header class="header">
        <img class="header__logo" src="./images/logo.svg" alt="Huddle Logo" />
      </header>

      <section class="hero">
        <img
          class="hero__image"
          src="./images/illustration-mockups.svg"
          alt="Desktop and mobile app mockups"
        />
        <div class="hero__content">
          <h1 class="hero__title">Build The Community Your Fans Will Love</h1>
          <p class="hero__description">
            Huddle re-imagines the way we build communities. You have a voice,
            but so does your audience. Create connections with your users as you
            engage in genuine discussion.
          </p>
          <button class="btn btn--primary" type="button">Register</button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <ul class="social-links">
        <li class="social-links__item">
          <a class="social-links__link" href="#" aria-label="Facebook">
            <i class="fa-brands fa-facebook-f"></i>
          </a>
        </li>
        <li class="social-links__item">
          <a class="social-links__link" href="#" aria-label="Twitter">
            <i class="fa-brands fa-twitter"></i>
          </a>
        </li>
        <li class="social-links__item">
          <a class="social-links__link" href="#" aria-label="Instagram">
            <i class="fa-brands fa-instagram"></i>
          </a>
        </li>
      </ul>
    </footer>
  </body>
</html>
