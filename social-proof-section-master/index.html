<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="See what 10,000+ satisfied customers say about our products and service."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Social proof section</title>
  </head>
  <body>
    <main>
      <article class="social-proof">
        <section class="social-proof__intro">
          <h1 class="social-proof__title">
            10,000+ of our users love our products.
          </h1>
          <p class="social-proof__description">
            We only provide great products combined with excellent customer
            service. See what our satisfied customers are saying about our
            services.
          </p>
        </section>

        <section class="social-proof__ratings" aria-label="Star ratings">
          <ul class="ratings-list" role="list">
            <li class="ratings-list__item">
              <div class="ratings-list__stars" aria-hidden="true">
                <img src="./images/icon-star.svg" alt="" />
                <img src="./images/icon-star.svg" alt="" />
                <img src="./images/icon-star.svg" alt="" />
                <img src="./images/icon-star.svg" alt="" />
                <img src="./images/icon-star.svg" alt="" />
              </div>

              <p class="ratings-list__label">Rated 5 Stars in Reviews</p>
            </li>
            <li class="ratings-list__item">
              <div class="ratings-list__stars" aria-hidden="true">
                <img src="./images/icon-star.svg" alt="" />
                <img src="./images/icon-star.svg" alt="" />
                <img src="./images/icon-star.svg" alt="" />
                <img src="./images/icon-star.svg" alt="" />
                <img src="./images/icon-star.svg" alt="" />
              </div>
              <p class="ratings-list__label">Rated 5 Stars in Report Guru</p>
            </li>
            <li class="ratings-list__item">
              <div class="ratings-list__stars" aria-hidden="true">
                <img src="./images/icon-star.svg" alt="" />
                <img src="./images/icon-star.svg" alt="" />
                <img src="./images/icon-star.svg" alt="" />
                <img src="./images/icon-star.svg" alt="" />
                <img src="./images/icon-star.svg" alt="" />
              </div>
              <p class="ratings-list__label">Rated 5 Stars in BestTech</p>
            </li>
          </ul>
        </section>

        <section
          class="social-proof__testimonials"
          aria-label="Customer testimonials"
        >
          <ul class="testimonials-list" role="list">
            <li class="testimonials-list__item">
              <figure class="testimonial-card">
                <div class="testimonial-card__author">
                  <img
                    class="testimonial-card__avatar"
                    src="./images/image-colton.jpg"
                    alt="Colton Smith"
                  />
                  <figcaption class="testimonial-card__info">
                    <p class="testimonial-card__name">Colton Smith</p>
                    <p class="testimonial-card__role">Verified Buyer</p>
                  </figcaption>
                </div>
                <blockquote class="testimonial-card__quote">
                  <p>
                    "We needed the same printed design as the one we had ordered
                    a week prior. Not only did they find the original order, but
                    we also received it in time. Excellent!"
                  </p>
                </blockquote>
              </figure>
            </li>

            <li class="testimonials-list__item">
              <figure class="testimonial-card">
                <div class="testimonial-card__author">
                  <img
                    class="testimonial-card__avatar"
                    src="./images/image-irene.jpg"
                    alt="Irene Roberts"
                  />
                  <figcaption class="testimonial-card__info">
                    <p class="testimonial-card__name">Irene Roberts</p>
                    <p class="testimonial-card__role">Verified Buyer</p>
                  </figcaption>
                </div>
                <blockquote class="testimonial-card__quote">
                  <p>
                    "Customer service is always excellent and very quick turn
                    around. Completely delighted with the simplicity of the
                    purchase and the speed of delivery."
                  </p>
                </blockquote>
              </figure>
            </li>

            <li class="testimonials-list__item">
              <figure class="testimonial-card">
                <div class="testimonial-card__author">
                  <img
                    class="testimonial-card__avatar"
                    src="./images/image-anne.jpg"
                    alt="Anne Wallace"
                  />
                  <figcaption class="testimonial-card__info">
                    <p class="testimonial-card__name">Anne Wallace</p>
                    <p class="testimonial-card__role">Verified Buyer</p>
                  </figcaption>
                </div>
                <blockquote class="testimonial-card__quote">
                  <p>
                    "Put an order with this company and can only praise them for
                    the very high standard. Will definitely use them again and
                    recommend them to everyone!"
                  </p>
                </blockquote>
              </figure>
            </li>
          </ul>
        </section>
      </article>
    </main>
  </body>
</html>
